<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reward Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="children-display" id="children">

        </div>

        <div class="entries">
            <button id="withdraw-button">Withdraw</button>
        </div>
    </main>

    <dialog id="withdraw-popup">
        <h2>Withdraw from your account</h2>
        <div class="error" id="withdraw-error" hidden>Error message</div>
        <form id="withdraw-form">
            <label for="children-select">Child</label>
            <select name="child" id="children-select" required>
                <option value="" disabled selected>Choose a child...</option>
            </select>
            <br>
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" min="0" max="500.00" step="1" placeholder="0.00" required>
            <br>
            <button type="submit" id="withdraw-submit">Withdraw</button>
            <button id="withdraw-close">Close</button>
        </form>
    </dialog>

    <!-- Child card template -->
    <template id="child-template">
        <article class="child">
            <h2 class="child-name"></h2>
            <p class="balance">Balance: $<span class="balance-value"></span></p>
            <p class="bonus">New Years bonus: <span id="bonus"></span></p>
        </article>
    </template>

    <script src="script.js"></script>
</body>

</html>
